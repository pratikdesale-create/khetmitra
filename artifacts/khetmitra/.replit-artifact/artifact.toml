kind = "web"
previewPath = "/"
title = "KhetMitra"
version = "1.0.0"
id = "artifacts/khetmitra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19822

[services.development]
run = "pnpm --filter @workspace/khetmitra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/khetmitra", "run", "build" ]
serve = "static"
publicDir = "artifacts/khetmitra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19822"
BASE_PATH = "/"
